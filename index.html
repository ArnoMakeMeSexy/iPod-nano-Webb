<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111">
<title>iPod nano Web V2</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div class="ipod">
    <div class="top"><span id="title">Music</span><span id="battery">▮▮▮▮</span></div>
    <div id="screen" class="screen"></div>
    <div class="bottom"><span id="mini">未播放</span><span id="clock"></span></div>
    <div class="wheel">
      <button id="menu">MENU</button><button id="prev">◀◀</button><button id="next">▶▶</button><button id="play">▶Ⅱ</button>
      <button id="select" class="select"></button>
    </div>
  </div>

  <div class="player">
    <div class="player-head"><b>Modern iPod nano</b><span id="count"></span></div>
    <input id="url" placeholder="貼 YouTube 歌曲網址">
    <div class="actions"><button id="add">加入歌曲</button><button id="playlist">匯入 Playlist</button></div>
    <div class="note">支援 YouTube URL、歌曲管理、歌手/歌曲分類、播放清單。YouTube 播放採官方嵌入播放器；Playlist 一鍵完整解析需後端 API。</div>
  </div>
</div>
<div id="yt" class="yt"></div>
<script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
